[package]
name = "betteroffice-fuzz"
version = "0.0.0"
publish = false
license = "Apache-2.0"
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ooxml-opc = { package = "betteroffice-opc", path = "../crates/ooxml-opc" }
pptx-parse = { package = "betteroffice-pptx-parse", path = "../crates/pptx-parse" }
pptx-raster = { package = "betteroffice-pptx-raster", path = "../crates/pptx-raster", features = ["fuzzing"] }
pptx-render = { package = "betteroffice-pptx-render", path = "../crates/pptx-render", features = ["fuzzing"] }

[[bin]]
name = "metafile-decode"
path = "fuzz_targets/metafile-decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pptx-package-parse"
path = "fuzz_targets/pptx-package-parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "svg-decode"
path = "fuzz_targets/svg-decode.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
