<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="BetterOffice's visual fidelity and formula accuracy measured against Microsoft Office, its speed against LibreOffice, and the editing latency of its SDKs."
    />
    <link rel="canonical" href="https://benchmarks.betteroffice.dev/" />
    <title>BetterOffice Benchmarks</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="min-h-dvh overflow-x-clip bg-bg font-sans text-[15px]/[1.55] text-fg antialiased">
    <header class="sticky top-0 z-20 border-b border-line-soft bg-head backdrop-blur-xl">
      <div class="wrap flex h-16 items-center justify-between gap-6 max-[36rem]:h-auto max-[36rem]:flex-wrap max-[36rem]:gap-y-2 max-[36rem]:py-3.5">
        <a class="flex items-center gap-2.5 text-[0.9375rem] font-semibold tracking-[-0.015em] whitespace-nowrap no-underline" href="https://betteroffice.dev"><svg class="h-[18px] w-auto text-fg" aria-hidden="true" viewBox="0 0 64 64" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M5 7 H28 L31 25 H8 Z"/><path d="M9 33 H32 L36 56 H13 Z"/><path d="M36 7 H51 L59 56 H44 Z"/></svg>BetterOffice <span class="font-normal text-faint">/ benchmarks</span></a>
        <nav class="flex flex-wrap items-center gap-x-7 gap-y-2 max-[44rem]:gap-x-5 max-[36rem]:gap-x-4" aria-label="Sections">
          <span class="hidden items-center gap-x-7 gap-y-2 max-[44rem]:gap-x-5 max-[36rem]:gap-x-4 lg:flex">
            <a class="font-mono text-xs text-ink no-underline transition-colors hover:text-fg" href="#scoreboard">scoreboard</a>
            <a class="font-mono text-xs text-ink no-underline transition-colors hover:text-fg" href="#docx">docx</a>
            <a class="font-mono text-xs text-ink no-underline transition-colors hover:text-fg" href="#pptx">pptx</a>
            <a class="font-mono text-xs text-ink no-underline transition-colors hover:text-fg" href="#xlsx">xlsx</a>
            <a class="font-mono text-xs text-ink no-underline transition-colors hover:text-fg" href="#latency">latency</a>
            <a class="font-mono text-xs text-ink no-underline transition-colors hover:text-fg" href="#method">method</a>
          </span>
          <a class="font-mono text-xs text-ink no-underline transition-colors hover:text-fg" href="/compare">compare</a>
          <a class="font-mono text-xs text-ink no-underline transition-colors hover:text-fg" href="https://betteroffice.dev">website</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="wrap pt-12 pb-[clamp(3.5rem,7vw,6rem)] md:pt-20" id="hero">
        <h1 class="max-w-[820px] text-[clamp(2.5rem,6vw,4.5rem)] leading-[0.95] font-semibold tracking-[-0.045em] text-balance">Benchmarks</h1>
        <p class="mt-6 max-w-[760px] text-ink">Head-to-head write-ups: <a class="text-fg underline decoration-faint underline-offset-[3px] hover:decoration-fg" href="https://betteroffice.dev/blog/betteroffice-vs-docx-editor">BetterOffice vs docx-editor.dev</a> for DOCX, and <a class="text-fg underline decoration-faint underline-offset-[3px] hover:decoration-fg" href="https://betteroffice.dev/blog/betteroffice-vs-univer">BetterOffice vs Univer</a> for XLSX.</p>
        <dl class="mt-8 flex flex-wrap gap-x-6 gap-y-3 md:gap-x-9" id="facts"></dl>
        <div class="mt-9 grid grid-cols-1 gap-px border border-line-soft bg-line-soft md:grid-cols-2 lg:grid-cols-4" id="kpis">
          <p class="col-span-full bg-bg px-6 py-11 text-[13.5px] text-dim">Loading the latest run…</p>
        </div>
      </section>

      <section class="wrap rule py-[clamp(3.5rem,7vw,6rem)]" id="scoreboard" hidden></section>

      <div id="formats"></div>
      <section id="latency"></section>
      <section id="method"></section>
    </main>

    <footer>
      <div class="wrap rule flex flex-wrap items-end justify-between gap-6 py-10">
        <div class="flex gap-6">
          <a class="font-mono text-xs text-ink no-underline transition-colors hover:text-fg" href="https://betteroffice.dev">website</a>
          <a class="font-mono text-xs text-ink no-underline transition-colors hover:text-fg" href="https://docs.betteroffice.dev">docs</a>
          <a class="font-mono text-xs text-ink no-underline transition-colors hover:text-fg" href="https://github.com/openooxml/betteroffice">github</a>
        </div>
        <p class="font-mono text-[0.6875rem] text-dim">Apache License 2.0 · by the OpenOOXML project</p>
      </div>
    </footer>

    <div class="pointer-events-none fixed top-0 left-0 z-50 max-w-[340px] min-w-[190px] border border-line-2 bg-bg px-3 py-2.5 text-[12px] shadow-(--shadow)" id="tip" hidden></div>
    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
