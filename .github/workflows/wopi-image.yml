name: WOPI image

# Pull requests and main pushes build and smoke test the image without
# pushing. Publishing happens only through workflow_call from release.yml
# after packages publish, only when WOPI_IMAGE_PUBLISH is true, and only after
# a required reviewer approves the ghcr-wopi-image environment.
# The image version is the version field of apps/wopi/package.json: that
# package stays private and is never published to npm, so bump its version
# there to change the version tag below. A version tag that already exists
# is never overwritten, and latest moves only when a new version is pushed.
on:
  pull_request:
    paths:
      - "apps/wopi/**"
      - "packages/**"
      - "crates/**"
      - "shared/**"
      - "scripts/**"
      - "bun.lock"
      - "Cargo.lock"
      - "package.json"
      - "Cargo.toml"
      - ".dockerignore"
      - ".github/workflows/wopi-image.yml"
  push:
    branches: [main]
    paths:
      - "apps/wopi/**"
      - "packages/**"
      - "crates/**"
      - "shared/**"
      - "scripts/**"
      - "bun.lock"
      - "Cargo.lock"
      - "package.json"
      - "Cargo.toml"
      - ".dockerignore"
      - ".github/workflows/wopi-image.yml"
  workflow_call:
    inputs:
      publish:
        description: Publish the image (release workflow only, after packages publish)
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: wopi-image-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build WOPI image
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/wopi/Dockerfile
          push: false
          load: true
          tags: betteroffice-wopi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        env:
          WOPI_PUBLIC_URL: http://127.0.0.1:3000
          WOPI_ALLOW_HTTP: "1"
          WOPI_HOSTS: '[{"id":"smoke","wopiSrcOrigins":["http://127.0.0.1:3000"],"frameOrigins":["http://127.0.0.1:3000"]}]'
        run: |
          data_volume=betteroffice-wopi-smoke-data
          cleanup() {
            docker rm -f betteroffice-wopi-smoke >/dev/null 2>&1 || true
            docker volume rm -f "$data_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$data_volume" >/dev/null
          docker run -d --name betteroffice-wopi-smoke \
            -p 3000:3000 \
            -v "$data_volume:/data" \
            -e WOPI_PUBLIC_URL \
            -e WOPI_ALLOW_HTTP \
            -e WOPI_HOSTS \
            betteroffice-wopi:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz > /tmp/wopi-health.json; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker logs betteroffice-wopi-smoke
              exit 1
            fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/wopi-health.json
          curl -fsS http://127.0.0.1:3000/hosting/discovery > /tmp/wopi-discovery.xml
          grep -q '<?xml' /tmp/wopi-discovery.xml
          grep -q '<wopi-discovery>' /tmp/wopi-discovery.xml
          grep -q '<proof-key ' /tmp/wopi-discovery.xml
          grep -Eq 'value="[^"]+"' /tmp/wopi-discovery.xml
          grep -Eq 'modulus="[^"]+"' /tmp/wopi-discovery.xml
          grep -Eq 'exponent="[^"]+"' /tmp/wopi-discovery.xml

  publish:
    name: Publish WOPI image
    if: ${{ inputs.publish && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.fork == false && startsWith(github.workflow_ref, format('{0}/.github/workflows/release.yml@refs/heads/main', github.repository)) && vars.WOPI_IMAGE_PUBLISH == 'true' }}
    environment: ghcr-wopi-image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the WOPI package version
        id: version
        run: |
          version=$(node -e "console.log(require('./apps/wopi/package.json').version)")
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::apps/wopi/package.json version is not a plain semver: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the version tag already exists
        id: exists
        run: |
          image="ghcr.io/${{ github.repository_owner }}/betteroffice-wopi:${{ steps.version.outputs.version }}"
          if inspection=$(docker buildx imagetools inspect "$image" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version tag $image already exists: skipping the push, latest is not moved."
          elif [ "$inspection" = "ERROR: $image: not found" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$inspection" >&2
            echo "::error::Could not confirm whether version tag $image exists."
            exit 1
          fi

      - name: Build and push image
        id: build
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/wopi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/betteroffice-wopi:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/betteroffice-wopi:latest
          labels: |
            org.opencontainers.image.title=betteroffice-wopi
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: steps.exists.outputs.exists == 'false'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/betteroffice-wopi
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
