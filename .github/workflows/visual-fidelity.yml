name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Repository branch to benchmark and update
        default: main
        required: true
        type: string
      samples:
        description: Optional JSON array of sample folders from the unified corpus
        default: ''
        required: false
        type: string
      publish_renders:
        description: Publish the commit-channel page renders to the fidelity R2 bucket
        default: true
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: visual-fidelity-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
      formats: ${{ steps.plan.outputs.formats }}
      docx-shards: ${{ steps.plan.outputs.docx-shards }}
      docx-published-source: ${{ steps.plan.outputs.docx-published-source }}
      pptx-published-source: ${{ steps.plan.outputs.pptx-published-source }}
      xlsx-shards: ${{ steps.plan.outputs.xlsx-shards }}
      xlsx-fidelity-shards: ${{ steps.plan.outputs.xlsx-fidelity-shards }}
      xlsx-published-source: ${{ steps.plan.outputs.xlsx-published-source }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the target branch
        id: source
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          git check-ref-format --branch "$TARGET_BRANCH"
          source_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$source_sha" = "$remote_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Freeze the corpus and package versions
        id: plan
        env:
          QUALITY_SAMPLES: ${{ inputs.samples }}
          QUALITY_OUTPUT: ${{ runner.temp }}/fidelity-plan
        run: |
          node scripts/office-quality/plan.mjs
          node --input-type=module - <<'JS'
          import { appendFile, readFile } from 'node:fs/promises';
          import { docxShards } from './scripts/office-quality/docx-benchmark.mjs';
          import { xlsxFidelityShards } from './scripts/office-quality/xlsx-fidelity.mjs';
          import { xlsxShards } from './scripts/office-quality/xlsx-benchmark.mjs';
          const plan = JSON.parse(await readFile(`${process.env.QUALITY_OUTPUT}/plan.json`, 'utf8'));
          await appendFile(process.env.GITHUB_OUTPUT, `formats=${JSON.stringify(plan.formats)}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `docx-shards=${JSON.stringify(docxShards(plan).map((_, index) => index))}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `docx-published-source=${plan.docx_published_source_sha ?? ''}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `xlsx-fidelity-shards=${JSON.stringify(xlsxFidelityShards(plan).map((_, index) => index))}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `xlsx-shards=${JSON.stringify(xlsxShards(plan).map((_, index) => index))}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `xlsx-published-source=${plan.xlsx_published_source_sha ?? ''}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `pptx-published-source=${plan.pptx_published_source_sha ?? ''}\n`);
          JS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-fidelity-plan
          path: ${{ runner.temp }}/fidelity-plan/plan.json
          if-no-files-found: error
          retention-days: 7

  measure:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        format: ${{ fromJSON(needs.prepare.outputs.formats) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: visual-fidelity-plan
          path: ${{ runner.temp }}/fidelity-plan

      - name: Restore fidelity asset cache
        id: fidelity-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/fidelity-assets
          key: fidelity-assets-v2-${{ runner.os }}-${{ matrix.format }}-
          restore-keys: |
            fidelity-assets-v2-${{ runner.os }}-${{ matrix.format }}-

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-${{ matrix.format }}

      - uses: ./.github/actions/wasm-toolchain

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Build the format renderer and install comparison tools
        env:
          QUALITY_FORMAT: ${{ matrix.format }}
        run: |
          bun install --frozen-lockfile
          bun run build:fonts
          bun run "build:$QUALITY_FORMAT"
          bunx playwright install --with-deps chromium
          python -m pip install -r scripts/office-quality/requirements.txt

      - name: Check benchmark scripts
        run: |
          bun test scripts/office-quality
          python -m unittest discover -s scripts/office-quality -p 'test_*.py'

      - name: Measure the format against the latest release
        env:
          QUALITY_PLAN: ${{ runner.temp }}/fidelity-plan/plan.json
          QUALITY_FORMAT: ${{ matrix.format }}
          QUALITY_OUTPUT: .source/office-quality/ci
          QUALITY_ASSET_CACHE: ${{ runner.temp }}/fidelity-assets
        run: node scripts/office-quality/run.mjs

      - name: Compute fidelity asset cache digest
        id: asset-cache
        if: always()
        run: |
          digest=$(node scripts/office-quality/asset-cache.mjs "${RUNNER_TEMP}/fidelity-assets")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Save fidelity asset cache
        if: always() && steps.asset-cache.outputs.digest != '' && steps.fidelity-cache.outputs.cache-matched-key != format('fidelity-assets-v2-{0}-{1}-{2}', runner.os, matrix.format, steps.asset-cache.outputs.digest)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/fidelity-assets
          key: fidelity-assets-v2-${{ runner.os }}-${{ matrix.format }}-${{ steps.asset-cache.outputs.digest }}

      - name: Upload the format report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-fidelity-report-${{ matrix.format }}
          path: .source/office-quality/ci/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload the format renders
        if: inputs.publish_renders
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-fidelity-renders-${{ matrix.format }}
          path: |
            .source/office-quality/ci/report.json
            .source/office-quality/ci/*/commit/page_*.png
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native-build:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.formats), 'docx')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: [published, commit]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.channel == 'published' && needs.prepare.outputs.docx-published-source || needs.prepare.outputs.source-sha }}
          path: .source/native-source
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docx-native-${{ matrix.channel }}
          workspaces: . -> target/native-benchmark

      - name: Compile the complete native DOCX CLI
        env:
          CHANNEL: ${{ matrix.channel }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-benchmark
        run: node scripts/office-quality/build-native.mjs .source/native-source "${RUNNER_TEMP}/native/${CHANNEL}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docx-native-${{ matrix.channel }}
          path: |
            ${{ runner.temp }}/native/${{ matrix.channel }}/docx-native-bench
            ${{ runner.temp }}/native/${{ matrix.channel }}/build.json
          if-no-files-found: error
          retention-days: 7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: matrix.channel == 'commit'
        with:
          bun-version: "1.3.14"

      - name: Freeze the shared native font bundle
        if: matrix.channel == 'commit'
        run: bun scripts/office-quality/native-fonts.ts "${RUNNER_TEMP}/native-fonts"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: matrix.channel == 'commit'
        with:
          name: docx-native-fonts
          path: ${{ runner.temp }}/native-fonts
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  docx-benchmark:
    needs: [prepare, native-build]
    if: contains(fromJSON(needs.prepare.outputs.formats), 'docx')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOFFICE: /opt/libreoffice26.2/program/soffice
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.docx-shards) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: visual-fidelity-plan
          path: ${{ runner.temp }}/fidelity-plan

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: docx-native-published
          path: ${{ runner.temp }}/native/published

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: docx-native-commit
          path: ${{ runner.temp }}/native/commit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: docx-native-fonts
          path: ${{ runner.temp }}/native-fonts

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install LibreOffice and comparison tools
        run: |
          bash scripts/office-quality/install-libreoffice.sh
          python -m pip install -r scripts/office-quality/requirements.txt
          chmod +x "${RUNNER_TEMP}/native/published/docx-native-bench" "${RUNNER_TEMP}/native/commit/docx-native-bench"
          "$SOFFICE" --version

      - name: Restore DOCX source and reference assets
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/fidelity-assets
          key: fidelity-assets-v2-${{ runner.os }}-docx-
          restore-keys: |
            fidelity-assets-v2-${{ runner.os }}-docx-

      - name: Download this shard's verified documents and references
        env:
          QUALITY_PLAN: ${{ runner.temp }}/fidelity-plan/plan.json
          QUALITY_SHARD: ${{ matrix.shard }}
          QUALITY_OUTPUT: ${{ runner.temp }}/docx-benchmark
          QUALITY_ASSET_CACHE: ${{ runner.temp }}/fidelity-assets
        run: node scripts/office-quality/docx-benchmark.mjs

      - name: Measure native CLI times and LibreOffice fidelity
        env:
          QUALITY_OUTPUT: ${{ runner.temp }}/docx-benchmark
          QUALITY_NATIVE: ${{ runner.temp }}/native
          QUALITY_FONTS: ${{ runner.temp }}/native-fonts/manifest.json
        run: python scripts/office-quality/docx_benchmark.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docx-benchmark-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/docx-benchmark/report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload DOCX benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docx-benchmark-diagnostics-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/docx-benchmark/report.json
            ${{ runner.temp }}/docx-benchmark/*/timing/*
            ${{ runner.temp }}/docx-benchmark/*/libreoffice/*
            ${{ runner.temp }}/docx-benchmark/*/lo-comparison/score.json
          compression-level: 0
          retention-days: 7

  xlsx-native-build:
    needs: prepare
    if: needs.prepare.outputs.xlsx-shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: [published, commit]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.channel == 'published' && needs.prepare.outputs.xlsx-published-source || needs.prepare.outputs.source-sha }}
          path: .source/native-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xlsx-native-${{ matrix.channel }}
          workspaces: . -> target/xlsx-benchmark
      - name: Compile the native XLSX recalculation CLI
        env:
          CHANNEL: ${{ matrix.channel }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/xlsx-benchmark
        run: node scripts/office-quality/build-format.mjs xlsx .source/native-source "${RUNNER_TEMP}/native/${CHANNEL}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xlsx-native-${{ matrix.channel }}
          path: |
            ${{ runner.temp }}/native/${{ matrix.channel }}/xlsx-native-bench
            ${{ runner.temp }}/native/${{ matrix.channel }}/build.json
          if-no-files-found: error
          retention-days: 7

  xlsx-benchmark:
    needs: [prepare, xlsx-native-build]
    if: needs.prepare.outputs.xlsx-shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOFFICE: /opt/libreoffice26.2/program/soffice
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.xlsx-shards) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: visual-fidelity-plan
          path: ${{ runner.temp }}/fidelity-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: xlsx-native-published
          path: ${{ runner.temp }}/native/published
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: xlsx-native-commit
          path: ${{ runner.temp }}/native/commit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install LibreOffice and comparison tools
        run: |
          bash scripts/office-quality/install-libreoffice.sh
          python -m pip install -r scripts/office-quality/requirements.txt
          chmod +x "${RUNNER_TEMP}/native/published/xlsx-native-bench" "${RUNNER_TEMP}/native/commit/xlsx-native-bench"
      - name: Download verified workbooks and Excel calculation references
        env:
          QUALITY_PLAN: ${{ runner.temp }}/fidelity-plan/plan.json
          QUALITY_SHARD: ${{ matrix.shard }}
          QUALITY_OUTPUT: ${{ runner.temp }}/xlsx-benchmark
          QUALITY_ASSET_CACHE: ${{ runner.temp }}/fidelity-assets
        run: node scripts/office-quality/xlsx-benchmark.mjs
      - name: Measure calculation accuracy and native CLI times
        env:
          QUALITY_OUTPUT: ${{ runner.temp }}/xlsx-benchmark
          QUALITY_NATIVE: ${{ runner.temp }}/native
        run: python scripts/office-quality/xlsx_benchmark.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xlsx-benchmark-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/xlsx-benchmark/report.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload XLSX calculation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xlsx-benchmark-diagnostics-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/xlsx-benchmark/report.json
            ${{ runner.temp }}/xlsx-benchmark/*/timing/**
          retention-days: 7

  pptx-native-build:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.formats), 'pptx')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: [published, commit]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.channel == 'published' && needs.prepare.outputs.pptx-published-source || needs.prepare.outputs.source-sha }}
          path: .source/native-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pptx-native-${{ matrix.channel }}
          workspaces: . -> target/pptx-benchmark
      - name: Compile the native PPTX rendering CLI
        env:
          CHANNEL: ${{ matrix.channel }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/pptx-benchmark
        run: node scripts/office-quality/build-format.mjs pptx .source/native-source "${RUNNER_TEMP}/native/${CHANNEL}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pptx-native-${{ matrix.channel }}
          path: |
            ${{ runner.temp }}/native/${{ matrix.channel }}/pptx-native-bench
            ${{ runner.temp }}/native/${{ matrix.channel }}/build.json
          if-no-files-found: error
          retention-days: 7

  pptx-benchmark:
    needs: [prepare, pptx-native-build]
    if: contains(fromJSON(needs.prepare.outputs.formats), 'pptx')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOFFICE: /opt/libreoffice26.2/program/soffice
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: visual-fidelity-plan
          path: ${{ runner.temp }}/fidelity-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pptx-native-published
          path: ${{ runner.temp }}/native/published
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pptx-native-commit
          path: ${{ runner.temp }}/native/commit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install LibreOffice and comparison tools
        run: |
          bash scripts/office-quality/install-libreoffice.sh
          python -m pip install -r scripts/office-quality/requirements.txt
          chmod +x "${RUNNER_TEMP}/native/published/pptx-native-bench" "${RUNNER_TEMP}/native/commit/pptx-native-bench"
          bun scripts/office-quality/native-fonts.ts "${RUNNER_TEMP}/native-fonts"
      - name: Download verified presentations and PowerPoint references
        env:
          QUALITY_PLAN: ${{ runner.temp }}/fidelity-plan/plan.json
          QUALITY_OUTPUT: ${{ runner.temp }}/pptx-benchmark
          QUALITY_ASSET_CACHE: ${{ runner.temp }}/fidelity-assets
        run: node scripts/office-quality/pptx-benchmark.mjs
      - name: Measure native slide render times and LibreOffice fidelity
        env:
          QUALITY_OUTPUT: ${{ runner.temp }}/pptx-benchmark
          QUALITY_NATIVE: ${{ runner.temp }}/native
          QUALITY_FONTS: ${{ runner.temp }}/native-fonts/manifest.json
        run: python scripts/office-quality/pptx_benchmark.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pptx-benchmark-report
          path: ${{ runner.temp }}/pptx-benchmark/report.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload PPTX LibreOffice diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pptx-benchmark-diagnostics
          path: |
            ${{ runner.temp }}/pptx-benchmark/report.json
            ${{ runner.temp }}/pptx-benchmark/*/timing/*
            ${{ runner.temp }}/pptx-benchmark/*/libreoffice/*
            ${{ runner.temp }}/pptx-benchmark/*/lo-comparison/score.json
          compression-level: 0
          retention-days: 7

  xlsx-fidelity:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.formats), 'xlsx')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOFFICE: /opt/libreoffice26.2/program/soffice
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.xlsx-fidelity-shards) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: visual-fidelity-plan
          path: ${{ runner.temp }}/fidelity-plan
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install LibreOffice and comparison tools
        run: |
          bash scripts/office-quality/install-libreoffice.sh
          python -m pip install -r scripts/office-quality/requirements.txt
          bun scripts/office-quality/native-fonts.ts "${RUNNER_TEMP}/native-fonts"
      - name: Download verified workbooks and Excel range references
        env:
          QUALITY_SHARD: ${{ matrix.shard }}
          QUALITY_PLAN: ${{ runner.temp }}/fidelity-plan/plan.json
          QUALITY_OUTPUT: ${{ runner.temp }}/xlsx-fidelity
          QUALITY_ASSET_CACHE: ${{ runner.temp }}/fidelity-assets
        run: node scripts/office-quality/xlsx-fidelity.mjs
      - name: Measure LibreOffice XLSX range fidelity
        env:
          QUALITY_OUTPUT: ${{ runner.temp }}/xlsx-fidelity
          QUALITY_FONTS: ${{ runner.temp }}/native-fonts/manifest.json
        run: python scripts/office-quality/xlsx_fidelity.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xlsx-fidelity-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/xlsx-fidelity/report.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload XLSX LibreOffice diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xlsx-fidelity-diagnostics-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/xlsx-fidelity/report.json
            ${{ runner.temp }}/xlsx-fidelity/*/libreoffice/**
            ${{ runner.temp }}/xlsx-fidelity/*/lo-comparison/score.json
          compression-level: 0
          retention-days: 7

  publish:
    needs: [prepare, measure, docx-benchmark, xlsx-benchmark, pptx-benchmark, xlsx-fidelity]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.prepare.result == 'success' && needs.measure.result == 'success' &&
      (!contains(fromJSON(needs.prepare.outputs.formats), 'docx') || needs.docx-benchmark.result == 'success') &&
      (needs.prepare.outputs.xlsx-shards == '[]' || needs.xlsx-benchmark.result == 'success') &&
      (!contains(fromJSON(needs.prepare.outputs.formats), 'pptx') || needs.pptx-benchmark.result == 'success') &&
      (!contains(fromJSON(needs.prepare.outputs.formats), 'xlsx') || needs.xlsx-fidelity.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Require the measured branch head
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: visual-fidelity-plan
          path: ${{ runner.temp }}/fidelity-plan

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: contains(fromJSON(needs.prepare.outputs.formats), 'docx')
        with:
          name: visual-fidelity-report-docx
          path: ${{ runner.temp }}/fidelity-parts/visual-fidelity-report-docx

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: contains(fromJSON(needs.prepare.outputs.formats), 'pptx')
        with:
          name: visual-fidelity-report-pptx
          path: ${{ runner.temp }}/fidelity-parts/visual-fidelity-report-pptx

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: contains(fromJSON(needs.prepare.outputs.formats), 'xlsx')
        with:
          name: visual-fidelity-report-xlsx
          path: ${{ runner.temp }}/fidelity-parts/visual-fidelity-report-xlsx

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.publish_renders && contains(fromJSON(needs.prepare.outputs.formats), 'docx')
        with:
          name: visual-fidelity-renders-docx
          path: ${{ runner.temp }}/fidelity-parts/visual-fidelity-renders-docx

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.publish_renders && contains(fromJSON(needs.prepare.outputs.formats), 'pptx')
        with:
          name: visual-fidelity-renders-pptx
          path: ${{ runner.temp }}/fidelity-parts/visual-fidelity-renders-pptx

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.publish_renders && contains(fromJSON(needs.prepare.outputs.formats), 'xlsx')
        with:
          name: visual-fidelity-renders-xlsx
          path: ${{ runner.temp }}/fidelity-parts/visual-fidelity-renders-xlsx

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: contains(fromJSON(needs.prepare.outputs.formats), 'docx')
        with:
          pattern: docx-benchmark-report-*
          path: ${{ runner.temp }}/fidelity-parts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: needs.prepare.outputs.xlsx-shards != '[]'
        with:
          pattern: xlsx-benchmark-report-*
          path: ${{ runner.temp }}/fidelity-parts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: contains(fromJSON(needs.prepare.outputs.formats), 'pptx')
        with:
          name: pptx-benchmark-report
          path: ${{ runner.temp }}/fidelity-parts/pptx-benchmark-report

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: contains(fromJSON(needs.prepare.outputs.formats), 'xlsx')
        with:
          pattern: xlsx-fidelity-report-*
          path: ${{ runner.temp }}/fidelity-parts

      - name: Reconcile the format reports
        env:
          QUALITY_PLAN: ${{ runner.temp }}/fidelity-plan/plan.json
          QUALITY_PARTS: ${{ runner.temp }}/fidelity-parts
          QUALITY_OUTPUT: ${{ runner.temp }}/fidelity-report
          QUALITY_REQUIRE_RENDERS: ${{ inputs.publish_renders }}
          QUALITY_REQUIRE_DOCX_BENCHMARK: 'true'
          QUALITY_REQUIRE_PPTX_BENCHMARK: 'true'
          QUALITY_REQUIRE_XLSX_BENCHMARK: 'true'
          QUALITY_REQUIRE_XLSX_FIDELITY: 'true'
        run: |
          node scripts/office-quality/merge.mjs
          cat "${QUALITY_OUTPUT}/section.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-fidelity
          path: |
            ${{ runner.temp }}/fidelity-report/report.json
            ${{ runner.temp }}/fidelity-report/section.md
          if-no-files-found: error
          retention-days: 30

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: inputs.publish_renders && github.repository == 'openooxml/betteroffice'
        with:
          bun-version: "1.3.14"

      - name: Publish the reconciled commit renders
        if: inputs.publish_renders && github.repository == 'openooxml/betteroffice'
        env:
          QUALITY_OUTPUT: ${{ runner.temp }}/fidelity-report
          QUALITY_RENDER_BUCKET: betteroffice-fidelity
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/office-quality/publish-renders.mjs

      - name: Replace the generated README section
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          section = (Path(os.environ['RUNNER_TEMP']) / 'fidelity-report/section.md').read_text()
          begin = '<!-- BEGIN GENERATED VISUAL FIDELITY -->'
          end = '<!-- END GENERATED VISUAL FIDELITY -->'
          if not section.startswith(begin) or not section.endswith(end):
              raise SystemExit('Invalid generated report')
          path = Path('README.md')
          if path.is_symlink() or not path.is_file():
              raise SystemExit('README must be a regular file')
          readme = path.read_text()
          if readme.count(begin) != 1 or readme.count(end) != 1:
              raise SystemExit('README must contain exactly one generated block')
          before, tail = readme.split(begin)
          _, after = tail.split(end)
          path.write_text(before + section + after)
          PY

      - name: Detect a changed report
        id: changed
        run: |
          if git diff --quiet -- README.md; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the bot token
        if: steps.changed.outputs.value == 'true'
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.OPENOOXML_BOT_APP_ID }}
          private-key: ${{ secrets.OPENOOXML_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit only the generated README
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          bot_id=$(gh api '/users/openooxml-bot[bot]' --jq .id)
          git config user.name 'openooxml-bot[bot]'
          git config user.email "$bot_id+openooxml-bot[bot]@users.noreply.github.com"
          git config core.hooksPath /dev/null
          gh auth setup-git
          git add -- README.md
          git commit -m 'docs(ci): refresh benchmarks'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
