name: Native dist

on:
  workflow_call:
    inputs:
      binding:
        description: The native package to build.
        required: true
        type: string
      sha:
        description: The commit to build.
        required: true
        type: string

jobs:
  bindings:
    name: ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings
          key: ${{ inputs.binding }}-native-${{ matrix.platform.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binding
        run: bunx napi build --cwd bindings/${{ inputs.binding }}-native --platform --target ${{ matrix.platform.target }} --release -- --locked

      - name: Test binding
        run: bun test bindings/${{ inputs.binding }}-native/index.test.ts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.binding }}-native.${{ matrix.platform.target }}
          path: bindings/${{ inputs.binding }}-native/betteroffice-${{ inputs.binding }}-native.*.node
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.platform.target == 'x86_64-unknown-linux-gnu'
        with:
          name: ${{ inputs.binding }}-native-loader
          path: bindings/${{ inputs.binding }}-native/index.js
          if-no-files-found: error
