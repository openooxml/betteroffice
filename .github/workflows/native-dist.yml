name: Native dist

on:
  workflow_call:
    inputs:
      binding:
        description: The native package to build.
        required: true
        type: string
      sha:
        description: The commit to build.
        required: true
        type: string

jobs:
  bindings:
    name: ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: ${{ matrix.platform.timeout || 45 }}
    env:
      ZIG_VERSION: '0.14.1'
      ZIGBUILD_VERSION: '0.23.4'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            timeout: 75
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            zig: true
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            zig: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
            cross: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            cross: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/checkout@v7.0.1
        if: endsWith(matrix.platform.target, '-linux-gnu')
        with:
          ref: ${{ github.workflow_sha }}
          path: .glibc-tools
          sparse-checkout: |
            scripts/cargo-glibc.sh
            scripts/glibc-floor.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - id: rust-pin
        shell: bash
        run: |
          if [[ -e rust-toolchain.toml || -L rust-toolchain.toml ]]; then
            if ! toolchain=$(sed -n \
              "/^[[:blank:]]*\[toolchain\][[:space:]]*$/,/^[[:blank:]]*\[/ s/^[[:blank:]]*channel[[:blank:]]*=[[:blank:]]*\(['\"]\)\([^'\"]*\)\1[[:space:]]*\(#.*\)\{0,1\}$/\2/p" \
              rust-toolchain.toml) || [[ ! "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::rust-toolchain.toml must pin channel to an exact MAJOR.MINOR.PATCH version"
              exit 1
            fi
          else
            toolchain=stable
          fi
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.rust-pin.outputs.toolchain }}
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings
          key: >-
            ${{ inputs.binding }}-native-${{ matrix.platform.target }}${{ endsWith(matrix.platform.target, '-linux-gnu') &&
            format('-zig-{0}-{1}-{2}-{3}', matrix.platform.os, env.ZIG_VERSION, env.ZIGBUILD_VERSION, hashFiles('.glibc-tools/scripts/cargo-glibc.sh', '.glibc-tools/scripts/glibc-floor.mjs')) || '' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Zig
        id: setup-zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.platform.zig
        timeout-minutes: 8
        continue-on-error: true
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check the installed Zig
        id: zig-installed
        if: matrix.platform.zig && steps.setup-zig.outcome != 'success'
        shell: bash
        run: |
          if version=$(zig version 2>/dev/null) && [ "$version" = "$ZIG_VERSION" ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Zig a second time
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.platform.zig && steps.setup-zig.outcome != 'success' && steps.zig-installed.outputs.usable != 'true'
        timeout-minutes: 8
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: taiki-e/install-action@v2
        if: matrix.platform.zig
        with:
          tool: cargo-zigbuild@${{ env.ZIGBUILD_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pin the glibc floor
        if: endsWith(matrix.platform.target, '-linux-gnu')
        shell: bash
        run: echo "CARGO=$PWD/.glibc-tools/scripts/cargo-glibc.sh" >> "$GITHUB_ENV"

      - name: Build binding
        run: bunx napi build --cwd bindings/${{ inputs.binding }}-native --platform --target ${{ matrix.platform.target }} --release ${{ matrix.platform.zig && '--cross-compile' || '' }} -- --locked

      - name: Check glibc floor
        if: endsWith(matrix.platform.target, '-linux-gnu')
        shell: bash
        run: node .glibc-tools/scripts/glibc-floor.mjs bindings/${{ inputs.binding }}-native/betteroffice-${{ inputs.binding }}-native.*.node

      - name: Build the font packages
        shell: bash
        run: |
          bun run --filter '@betteroffice/fonts-latin' --filter '@betteroffice/fonts-intl' --filter '@betteroffice/fonts-cjk' build
          (cd packages/fonts && bunx tsup)

      - name: Build the JS entries
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run --cwd bindings/${{ inputs.binding }}-native --if-present build:js

      - name: Smoke test on Debian 12
        if: endsWith(matrix.platform.target, '-linux-gnu')
        shell: bash
        run: docker run --rm -v "$PWD:/work" -w /work node:24-bookworm-slim sh -c 'node .glibc-tools/scripts/glibc-floor.mjs bindings/${{ inputs.binding }}-native/betteroffice-${{ inputs.binding }}-native.*.node && node scripts/native-raw-smoke.mjs ${{ inputs.binding }}'

      - name: Smoke test on Debian 11
        if: endsWith(matrix.platform.target, '-linux-gnu')
        shell: bash
        run: docker run --rm -v "$PWD:/work" -w /work node:22-bullseye-slim sh -c 'node .glibc-tools/scripts/glibc-floor.mjs bindings/${{ inputs.binding }}-native/betteroffice-${{ inputs.binding }}-native.*.node && node scripts/native-raw-smoke.mjs ${{ inputs.binding }}'

      - name: Test binding
        if: ${{ !matrix.platform.cross }}
        run: bun test bindings/${{ inputs.binding }}-native/index.test.ts ${{ inputs.binding != 'xlsx' && format('bindings/{0}-native/png.test.ts', inputs.binding) || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.binding }}-native.${{ matrix.platform.target }}
          path: bindings/${{ inputs.binding }}-native/betteroffice-${{ inputs.binding }}-native.*.node
          if-no-files-found: error
          overwrite: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.platform.target == 'x86_64-unknown-linux-gnu'
        with:
          name: ${{ inputs.binding }}-native-loader
          path: |
            bindings/${{ inputs.binding }}-native/index.js
            bindings/${{ inputs.binding }}-native/dist
          if-no-files-found: error
          overwrite: true

  musl-smoke:
    name: ${{ matrix.target }} on Alpine
    needs: bindings
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.binding }}-native.${{ matrix.target }}
          path: bindings/${{ inputs.binding }}-native

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.binding }}-native-loader
          path: bindings/${{ inputs.binding }}-native

      - name: Smoke test on Alpine
        run: docker run --rm -v "$PWD:/work" -w /work node:24-alpine node scripts/native-raw-smoke.mjs ${{ inputs.binding }}

  windows-arm64-smoke:
    name: Smoke test on Windows ARM64
    needs: bindings
    runs-on: windows-11-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.binding }}-native.aarch64-pc-windows-msvc
          path: bindings/${{ inputs.binding }}-native

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.binding }}-native-loader
          path: bindings/${{ inputs.binding }}-native

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          architecture: arm64

      - name: Smoke test on Windows ARM64
        run: node scripts/native-raw-smoke.mjs ${{ inputs.binding }}
