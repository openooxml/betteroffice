name: Route

on:
  workflow_call:
    inputs:
      jobs:
        description: Space-separated job keys of the caller
        required: true
        type: string
    outputs:
      runners:
        description: JSON map job key -> runner label
        value: ${{ jobs.route.outputs.runners }}

jobs:
  route:
    name: Pick runners
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      runners: ${{ steps.pick.outputs.runners }}
    steps:
      - id: pick
        uses: actions/github-script@v9
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PINNED: ${{ vars.BO_CI_RUNNER }}
          KYORA_CAP: ${{ vars.BO_KYORA_CAP || '20' }}
          JOBS: ${{ inputs.jobs }}
        with:
          script: |
            // Job key -> [leanest kyora class, expected minutes on it].
            const CLASSES = {
              rust: ['kyora-8x16', 30],
              'package-tests-1': ['kyora-8x8', 25],
              'browser-1': ['kyora-8x8', 22],
              corpus: ['kyora-8x8', 16],
              packages: ['kyora-4x8', 15],
              'package-tests-2': ['kyora-8x8', 12],
              'browser-2': ['kyora-8x8', 12],
              python: ['kyora-4x8', 10],
              native: ['kyora-4x8', 6],
              audit: ['kyora-4x8', 1],
            };
            const { FORK, PINNED, JOBS = '' } = process.env;
            const keys = JOBS.trim().split(/\s+/).filter(Boolean);
            const pick = (runners, reason) => {
              core.setOutput('runners', JSON.stringify(runners));
              for (const key of keys) core.info(`${key} runs on ${runners[key]}: ${reason}`);
            };
            const pickAll = (runner, reason) =>
              pick(Object.fromEntries(keys.map((key) => [key, runner])), reason);
            if (FORK === 'true') return pickAll('ubuntu-latest', 'fork pull request');
            if (PINNED) return pickAll(PINNED, 'BO_CI_RUNNER');
            const parsedCap = Number(process.env.KYORA_CAP);
            const cap = Number.isFinite(parsedCap) ? Math.max(0, parsedCap) : 0;
            try {
              const signal = AbortSignal.timeout(60_000);
              const runIds = new Set();
              for (const status of ['queued', 'in_progress']) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({ ...context.repo, status, per_page: 100, request: { signal } });
                if (data.total_count > data.workflow_runs.length) return pickAll('ubuntu-latest', `${status} runs listing truncated`);
                for (const run of data.workflow_runs) runIds.add(run.id);
              }
              let busy = 0;
              for (const run_id of runIds) {
                const { data } = await github.rest.actions.listJobsForWorkflowRun({ ...context.repo, run_id, filter: 'latest', per_page: 100, request: { signal } });
                if (data.total_count > data.jobs.length) return pickAll('ubuntu-latest', `jobs listing truncated for run ${run_id}`);
                for (const job of data.jobs) {
                  if ((job.status === 'queued' || job.status === 'in_progress') && job.labels.some((label) => /^kyora-\d+x\d+/.test(label))) busy++;
                }
                if (busy >= cap) break;
              }
              const free = Math.max(0, cap - busy);
              const minutes = (key) => (Object.hasOwn(CLASSES, key) ? CLASSES[key][1] : -1);
              const selected = new Set([...keys].sort((a, b) => minutes(b) - minutes(a)).slice(0, free));
              pick(
                Object.fromEntries(
                  keys.map((key) => [
                    key,
                    selected.has(key) && Object.hasOwn(CLASSES, key) ? CLASSES[key][0] : 'ubuntu-latest',
                  ]),
                ),
                `${busy} of ${cap} kyora jobs busy`,
              );
            } catch (error) {
              pickAll('ubuntu-latest', `failed to inspect active runs: ${error?.message ?? error}`);
            }
