name: Python dist

# Build the wheels and sdist for one bindings/python-* distribution. Publishing
# stays with the caller: PyPI cannot name a reusable workflow as a Trusted
# Publisher, because the OIDC claim points here instead of at release.yml.
# https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
on:
  workflow_call:
    inputs:
      binding:
        description: The bindings/python-<binding> distribution to build.
        required: true
        type: string

jobs:
  wheels:
    name: Wheel (${{ matrix.platform.os }} ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - os: ubuntu-latest
            target: aarch64
            manylinux: "2014"
          - os: macos-latest
            target: aarch64
            manylinux: auto
          - os: macos-latest
            target: x86_64
            manylinux: auto
          - os: windows-latest
            target: x64
            manylinux: auto
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: bindings/python-${{ inputs.binding }}

      # A binding name holds no dot, so `python-<a>.*` cannot reach binding `a-b`.
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ inputs.binding }}.${{ matrix.platform.os }}.${{ matrix.platform.target }}
          path: bindings/python-${{ inputs.binding }}/dist
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python-${{ inputs.binding }}

      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ inputs.binding }}.sdist
          path: bindings/python-${{ inputs.binding }}/dist
          if-no-files-found: error

  # `needs` inside a called workflow scopes to this binding alone, so this
  # receipt exists only when every one of its own artifacts does. The publish
  # matrix demands it per binding instead of depending on the whole build.
  built:
    name: Complete
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "${{ inputs.binding }}" > built.txt

      - uses: actions/upload-artifact@v4
        with:
          name: built-${{ inputs.binding }}
          path: built.txt
