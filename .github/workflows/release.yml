name: Release

# Pending changesets → open/update a "chore: release" PR (version bumps +
# CHANGELOGs). No pending changesets → run the gate and publish packages.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publishing: ${{ steps.pending.outputs.publishing }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC provenance / Trusted Publishing
      actions: write # dispatch deploy.yml after publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Node 24 ships npm >= 11.5.1, required for provenance and OIDC publishing.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect pending changesets
        id: pending
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "publishing=$([ "$count" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/wasm-toolchain
        if: steps.pending.outputs.publishing == 'true'

      - uses: taiki-e/install-action@v2
        if: steps.pending.outputs.publishing == 'true'
        with:
          tool: wasm-pack@0.15.0

      - name: Type check
        if: steps.pending.outputs.publishing == 'true'
        run: bun run typecheck:packages

      - name: Test
        if: steps.pending.outputs.publishing == 'true'
        run: bun run test

      - name: Build packages
        if: steps.pending.outputs.publishing == 'true'
        run: bun run build:packages

      - name: Detect crates.io bootstrap token
        id: crates-bootstrap
        if: steps.pending.outputs.publishing == 'true'
        env:
          TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to crates.io
        id: crates-auth
        if: steps.pending.outputs.publishing == 'true' && steps.crates-bootstrap.outputs.enabled != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Check crates.io publish targets
        if: steps.pending.outputs.publishing == 'true'
        env:
          CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: node scripts/check-publish-targets.mjs --crates

      - name: Publish Rust crates
        if: steps.pending.outputs.publishing == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN || steps.crates-auth.outputs.token }}
        run: bun run publish:crates

      # changesets does not rewrite the workspace: protocol here, so pin it to
      # concrete versions before publish (ephemeral checkout; source is unchanged).
      - name: Pin workspace deps for npm publish
        if: steps.pending.outputs.publishing == 'true'
        run: bun scripts/rewrite-workspace-deps.ts

      # Publishing here means there are no pending changesets, so changesets/action
      # runs no `version` command: these manifests carry the versions it publishes.
      - name: Check npm publish targets
        if: steps.pending.outputs.publishing == 'true'
        run: node scripts/check-publish-targets.mjs --npm

      - name: Release PR or publish
        id: changesets
        uses: changesets/action@v1.9.0
        with:
          version: bun run version-packages
          publish: bunx changeset publish
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token: auth is OIDC Trusted Publishing (configured per
          # package after the first manual publish creates it). id-token: write
          # above authorizes the exchange and signs provenance.
          NPM_CONFIG_PROVENANCE: "true"

      # GITHUB_TOKEN releases don't fire `on: release`, so dispatch directly.
      - name: Trigger deploy
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

  python-bindings:
    name: Python release train
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.publishing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    permissions:
      contents: read
    steps:
      # This job declares no `environment:`, so any token it can read is repository- or org-scoped.
      - name: Refuse a repository-scoped PyPI token
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "::error::PYPI_API_TOKEN is readable by a job that declares no environment, so it is a repository or organization secret and every binding's publish leg can upload with it."
            echo "::error::Delete it under Settings > Secrets and variables > Actions, then revoke it on PyPI."
            echo "::error::Preferred: add a PyPI Trusted Publisher (owner openooxml, repository betteroffice, workflow publish-python-binding.yml, environment pypi-<binding>) and keep no token at all."
            echo "::error::Otherwise: mint a project-scoped token and re-add it as an environment secret on the pypi-<binding> environment only. This step cannot tell a project-scoped token from an account-scoped one, so an account-scoped token would pass."
            echo "::error::See RELEASING.md."
            exit 1
          fi

      - uses: actions/checkout@v7

      - id: registry
        run: echo "publish=$(node scripts/python-bindings.mjs --publish)" >> "$GITHUB_OUTPUT"

  # A PyPI Trusted Publisher is scoped to the file that runs the upload, and every
  # publisher here names publish-python-binding.yml, so the release dispatches that
  # workflow instead of uploading. It builds main, which already carries the
  # release commit this run was triggered by.
  python-pypi:
    name: Dispatch Python publishes
    needs: python-bindings
    if: needs.python-bindings.outputs.publish != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch publish-python-binding.yml
    steps:
      - name: Dispatch a publish per binding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ needs.python-bindings.outputs.publish }}
        run: |
          status=0
          for binding in $(echo "$PUBLISH" | jq -r '.[]'); do
            gh workflow run publish-python-binding.yml --ref main \
              -f binding="$binding" -f dry_run=false || status=1
          done
          exit $status
