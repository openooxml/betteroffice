name: Retry native packages

on:
  workflow_run:
    workflows: [Native packages]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    name: Re-run failed native builds once
    if: >-
      github.run_attempt == 1 &&
      github.event.workflow_run.path == '.github/workflows/native-packages.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
    steps:
      - name: Re-run the failed jobs unless a person or a newer run cancelled them
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          trap 'summary "No re-run confirmed: a GitHub API call for $RUN_URL failed."' ERR

          for state in requested queued pending waiting; do
            count=$(gh api "repos/$REPO/actions/workflows/native-packages.yml/runs?branch=main&status=$state&per_page=1" --jq '.total_count')
            if [ "$count" != 0 ]; then
              summary "Not re-run: another Native packages run on main is $state, and a re-run would take its place in the queue."
              exit 0
            fi
          done

          jobs=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/1/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | [.id, .conclusion, .name] | @tsv')
          if [ -z "$jobs" ]; then
            summary "Not re-run: $RUN_URL/attempts/1 has no failed or cancelled job."
            exit 0
          fi
          stopped='^"(The run was canceled by @[A-Za-z0-9-]+(\[bot\])?\.|Canceling since a higher priority waiting request for [^"\\]+ exists)"$'
          while IFS=$'\t' read -r id result _; do
            [ "$result" = cancelled ] || continue
            messages=$(gh api --paginate "repos/$REPO/check-runs/$id/annotations?per_page=100" --jq '.[].message | tojson')
            while IFS= read -r message; do
              if [[ $message =~ $stopped ]]; then
                summary "Not re-run: $RUN_URL was stopped on purpose: ${BASH_REMATCH[1]}"
                exit 0
              fi
            done <<< "$messages"
          done <<< "$jobs"

          run=$(gh api "repos/$REPO/actions/runs/$RUN_ID" \
            --jq '[.path, .event, .head_branch, .head_repository.full_name, .run_attempt, .status, .conclusion] | @tsv')
          IFS=$'\t' read -r path event branch head attempt status _ <<< "$run"
          path=${path%%@*}
          if [ "$path" != .github/workflows/native-packages.yml ] || [ "$event" != push ] || [ "$branch" != main ] || [ "$head" != "$REPO" ]; then
            summary "Not re-run: $RUN_URL is not a push to main of this repository's Native packages workflow."
            exit 0
          fi
          if [ "$attempt" != 1 ] || [ "$status" != completed ]; then
            summary "Not re-run: $RUN_URL is on attempt $attempt ($status), so it was already re-run."
            exit 0
          fi

          gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs" --silent
          names=$(cut -f2,3 <<< "$jobs" | awk -F'\t' '{ printf "%s%s (%s)", sep, $2, $1; sep = ", " }')
          summary "Requested one re-run of $RUN_URL; attempt 1 ($RUN_URL/attempts/1) ended with: $names."
