name: Node native dist

on:
  workflow_call:
    inputs:
      binding:
        description: The bindings/node-<binding> package to build.
        required: true
        type: string
      sha:
        description: The commit to build.
        required: true
        type: string

jobs:
  bindings:
    name: ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings
          key: node-${{ inputs.binding }}-${{ matrix.platform.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binding
        run: bunx napi build --cwd bindings/node-${{ inputs.binding }} --target ${{ matrix.platform.target }} --release

      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ inputs.binding }}.${{ matrix.platform.target }}
          path: bindings/node-${{ inputs.binding }}/betteroffice-${{ inputs.binding }}-native.*.node
          if-no-files-found: error
