name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # run_id, not ref: a shared group still drops a queued run between two
  # quick main pushes even with cancel-in-progress false.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The router fills the account's free GitHub-hosted runners first; a job that does not fit, or every job when
  # the router cannot count, runs on a fresh kyora VM of the leanest class that fits. The router itself runs on
  # kyora, so it never queues behind the GitHub-hosted limit it measures. The two shortest (Security audit, Native
  # gate) stay GitHub-hosted. Fork pull requests stay GitHub-hosted, BO_CI_RUNNER pins every job to one label,
  # BO_CI_SPILL=off keeps them on kyora, and BO_CI_GH_LIMIT/BO_CI_GH_RESERVE size the GitHub share.
  route:
    name: Route runners
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.BO_CI_RUNNER || 'kyora-4x8' }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      packages: ${{ steps.route.outputs.packages }}
      python: ${{ steps.route.outputs.python }}
      package_tests: ${{ steps.route.outputs.package_tests }}
      rust: ${{ steps.route.outputs.rust }}
    steps:
      - uses: actions/checkout@v7.0.1
        continue-on-error: true
        with:
          sparse-checkout: scripts/ci-route.mjs
          sparse-checkout-cone-mode: false

      - name: Route the jobs
        id: route
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE_GROUPS: packages python package_tests:2 rust
          ROUTE_PEER_SLOTS: 3
          BO_CI_GH_LIMIT: ${{ vars.BO_CI_GH_LIMIT }}
          BO_CI_GH_RESERVE: ${{ vars.BO_CI_GH_RESERVE }}
          BO_CI_SPILL: ${{ vars.BO_CI_SPILL }}
          BO_CI_RUNNER: ${{ vars.BO_CI_RUNNER }}
        run: node scripts/ci-route.mjs

  packages:
    name: Package gate
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.BO_CI_RUNNER || vars.BO_CI_SPILL != 'off' && needs.route.outputs.packages || 'kyora-4x8' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - uses: ./.github/actions/wasm-toolchain

      # Reads `wasm-opt --version`, so it has to follow the toolchain step.
      - name: Fingerprint the wasm inputs
        id: wasm
        run: echo "key=$(bun scripts/wasm-cache-key.ts)" >> "$GITHUB_OUTPUT"

      # rust-cache prunes the workspace's own artifacts, and wasm-opt costs minutes per module.
      - uses: actions/cache@v6.1.0
        with:
          path: target/wasm-pack
          key: wasm-pack-${{ steps.wasm.outputs.key }}

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the lockfile is current
        run: |
          bun install --lockfile-only
          git diff --exit-code -- bun.lock

      - name: Check changeset length
        run: bun scripts/check-changeset-length.ts

      - name: Type check
        run: |
          bun run typecheck:shared
          bun run typecheck:packages
          bun run --filter '@betteroffice/collaboration-relay' typecheck

      # What `bun run test` builds; the tests themselves run in the package-tests shards.
      - name: Build the Wasm modules
        run: |
          bun run build:wasm
          bun run build:fonts

      - name: Check generated Wasm declarations
        run: git diff --exit-code -- 'packages/*/src/wasm/generated/*'

      - name: Check demo assets
        run: |
          bun scripts/create-demo-deck.ts
          bun scripts/create-demo-workbook.ts
          bun scripts/create-demo-diagram.ts
          bun run --filter './apps/demo' check:seeds
          git diff --exit-code -- apps/demo/public/betteroffice-demo.pptx apps/demo/public/showcase.xlsx apps/demo/public/betteroffice-demo.vsdx

      - name: Check minimal Wasm features
        run: |
          cargo check -p xlsx-wasm --target wasm32-unknown-unknown --no-default-features
          cargo check -p betteroffice-docx --target wasm32-unknown-unknown
          cargo check -p pptx-wasm --target wasm32-unknown-unknown
          cargo check -p vsdx-wasm --target wasm32-unknown-unknown --no-default-features

      - name: Build
        run: bun run build:packages

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Import every package entry in plain Node
        run: node scripts/check-node-import.mjs

  package-tests:
    name: Package tests (${{ matrix.shard }}/2)
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.BO_CI_RUNNER || vars.BO_CI_SPILL != 'off' && needs.route.outputs.package_tests || 'kyora-8x8' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - uses: ./.github/actions/wasm-toolchain

      - name: Fingerprint the wasm inputs
        id: wasm
        run: echo "key=$(bun scripts/wasm-cache-key.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: target/wasm-pack
          key: wasm-pack-${{ steps.wasm.outputs.key }}

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test --shard=${{ matrix.shard }}/2

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Report all advisories
        run: bun audit
        continue-on-error: true

      # GHSA-5p4m-2wfm-xmqj reaches only read-yaml-file under @changesets/cli,
      # which parses our own changesets; every way to move it is worse than the
      # advisory. GHSA-vfj7-8cjw-p6xm reaches braces only through build and dev
      # tooling, and no patched release exists. See SECURITY.md.
      - name: Fail on high or critical advisories
        run: bun audit --audit-level=high --ignore=GHSA-5p4m-2wfm-xmqj --ignore=GHSA-vfj7-8cjw-p6xm

  rust:
    name: Rust gate
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.BO_CI_RUNNER || vars.BO_CI_SPILL != 'off' && needs.route.outputs.rust || 'kyora-8x16' }}
    timeout-minutes: 90
    # Full debuginfo in every test binary fills a kyora VM's disk; backtraces keep file:line.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7.0.1

      # A GitHub-hosted runner has too little free disk for the workspace's test binaries.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Detect Rust workspace
        id: ws
        run: echo "present=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.ws.outputs.present == 'true'
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        if: steps.ws.outputs.present == 'true'

      - name: Format check
        if: steps.ws.outputs.present == 'true'
        run: cargo fmt --check

      - name: Clippy
        if: steps.ws.outputs.present == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy optional features
        if: steps.ws.outputs.present == 'true'
        run: |
          cargo clippy -p betteroffice-drawingml --all-targets --all-features -- -D warnings
          cargo clippy -p betteroffice-metafile --all-targets --all-features -- -D warnings
          cargo clippy -p betteroffice-docx-parse --all-targets --features tiff,metafile -- -D warnings
          cargo clippy -p betteroffice-docx-edit --all-targets --features wasm -- -D warnings
          cargo clippy -p betteroffice-docx --all-targets --all-features -- -D warnings
          cargo clippy -p betteroffice-pptx --all-targets --all-features -- -D warnings
          cargo clippy -p betteroffice-vsdx-edit --all-targets --all-features -- -D warnings

      - name: Lint standalone Rust bindings
        if: steps.ws.outputs.present == 'true'
        run: |
          cargo fmt --check --all --manifest-path bindings/Cargo.toml
          cargo clippy --locked --manifest-path bindings/Cargo.toml --workspace --all-targets -- -D warnings

      # Running a fuzz target needs nightly; checking that the package still builds does not.
      - name: Lint the standalone fuzz package
        if: steps.ws.outputs.present == 'true'
        run: |
          cargo fmt --check --all --manifest-path fuzz/Cargo.toml
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

      - name: Test
        if: steps.ws.outputs.present == 'true'
        run: cargo test

      # Optional features are only unified into `cargo test` while some other
      # workspace member enables them.
      - name: Test optional features
        if: steps.ws.outputs.present == 'true'
        run: |
          cargo test -p betteroffice-drawingml --all-features
          cargo test -p betteroffice-metafile --all-features
          cargo test -p betteroffice-docx-parse --features tiff,metafile
          cargo test -p betteroffice-docx --all-features
          cargo test -p betteroffice-pptx --all-features
          cargo test -p betteroffice-vsdx-edit --features wasm
          cargo test -p betteroffice-docx-edit --features wasm

      - name: Package publishable crates
        if: steps.ws.outputs.present == 'true'
        run: node scripts/publish-crates.mjs --dry-run

      # cargo-deny-action runs in Docker, which kyora VMs lack; this is the cargo-deny its v2.1.1 runs.
      - uses: taiki-e/install-action@v2
        if: steps.ws.outputs.present == 'true'
        with:
          tool: cargo-deny@0.20.2

      - name: License and advisory gate
        if: steps.ws.outputs.present == 'true'
        run: cargo deny --log-level warn --all-features check bans licenses advisories sources

      - name: License and advisory gate for the fuzz package
        if: steps.ws.outputs.present == 'true'
        run: cargo deny --log-level warn --manifest-path fuzz/Cargo.toml --all-features --config deny.toml check bans licenses advisories sources

  python:
    name: Python gate
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.BO_CI_RUNNER || vars.BO_CI_SPILL != 'off' && needs.route.outputs.python || 'kyora-4x8' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings

      - name: Build and install the extensions
        run: |
          python -m pip install --upgrade pip pytest
          for binding in $(node scripts/python-bindings.mjs --paths); do
            python -m pip install -e "$binding"
          done

      - name: Test
        run: |
          for binding in $(node scripts/python-bindings.mjs --paths); do
            (cd "$binding" && pytest -q)
          done

  native:
    name: Native gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bindings
          key: native

      - uses: ./.github/actions/wasm-toolchain

      - name: Fingerprint the wasm inputs
        id: wasm
        run: echo "key=$(bun scripts/wasm-cache-key.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: target/wasm-pack
          key: wasm-pack-${{ steps.wasm.outputs.key }}

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.9.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build wasm for parity
        run: |
          bun run --filter @betteroffice/xlsx build:wasm
          bun run --filter @betteroffice/pptx build:wasm

      - name: Build and test
        run: |
          for package in $(node scripts/native-bindings.mjs --paths); do
            bunx napi build --cwd "$package" --platform -- --locked
            bun test "$package/index.test.ts"
          done

      - name: Check native and wasm parity
        run: bun test bindings/xlsx-native/parity.test.ts bindings/pptx-native/parity.test.ts

      - name: Check generated declarations
        run: git diff --exit-code -- 'bindings/*-native/index.d.ts'

      - name: Check runtimes
        run: |
          node scripts/native-bindings-smoke.mjs
          bun scripts/native-bindings-smoke.mjs
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          for package in $(node scripts/native-bindings.mjs --paths); do
            format=${package#bindings/}
            package_dir="$smoke_dir/node_modules/@betteroffice/$format"
            mkdir -p "$package_dir"
            cp "$package/package.json" "$package/index.js" "$package/index.d.ts" "$package/"*.node "$package_dir/"
          done
          cp scripts/native-bindings-smoke.mjs "$smoke_dir/smoke.mjs"
          deno run --no-config --node-modules-dir=manual --allow-read --allow-env --allow-ffi "$smoke_dir/smoke.mjs" "$PWD"
