name: End-to-end

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: corpus
            name: Corpus scenarios
          - suite: browser
            name: Browser editors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure test paths
        run: |
          printf '%s\n' \
            "BETTEROFFICE_E2E_VENV=$RUNNER_TEMP/e2e-venv" \
            "QUALITY_ASSET_CACHE=$RUNNER_TEMP/e2e-assets" \
            "BETTEROFFICE_E2E_OUTPUT=$RUNNER_TEMP/e2e-results" \
            "BETTEROFFICE_BROWSER_OUTPUT=$RUNNER_TEMP/browser-results" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: e2e-${{ matrix.suite }}
          workspaces: |
            . -> target
            bindings -> target

      - uses: ./.github/actions/wasm-toolchain

      - name: Fingerprint the wasm inputs
        id: wasm
        run: echo "key=$(bun scripts/wasm-cache-key.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/wasm-pack
          key: wasm-pack-${{ steps.wasm.outputs.key }}

      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the harness contracts
        if: matrix.suite == 'corpus'
        run: |
          bun run typecheck:e2e
          bun run test:e2e:harness

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        if: matrix.suite == 'corpus'
        with:
          version: '0.11.8'

      - name: Build the Python bindings
        if: matrix.suite == 'corpus'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/bindings/target
        run: |
          uv tool install maturin==1.14.1
          bun e2e/python-env.ts

      - name: Restore the pinned corpus documents
        if: matrix.suite == 'corpus'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/e2e-assets
          key: e2e-assets-${{ hashFiles('e2e/corpus.ts') }}

      - name: Run the corpus scenarios
        if: matrix.suite == 'corpus'
        run: bun run test:e2e

      - name: Install headless Chromium
        if: matrix.suite == 'browser'
        run: bunx playwright install --with-deps chromium

      - name: Run the production editors in Chromium
        if: matrix.suite == 'browser'
        run: bun run test:e2e:browser

      - name: Upload corpus results
        if: always() && matrix.suite == 'corpus'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-timings
          path: ${{ runner.temp }}/e2e-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload browser report and failure traces
        if: always() && matrix.suite == 'browser'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-browser
          path: ${{ runner.temp }}/browser-results
          if-no-files-found: warn
          retention-days: 14
