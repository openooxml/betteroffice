name: End-to-end

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenarios:
    name: Corpus scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
          workspaces: |
            . -> target
            bindings -> target

      - uses: ./.github/actions/wasm-toolchain

      # Reads `wasm-opt --version`, so it has to follow the toolchain step.
      - name: Fingerprint the wasm inputs
        id: wasm
        run: echo "key=$(bun scripts/wasm-cache-key.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: target/wasm-pack
          key: wasm-pack-${{ steps.wasm.outputs.key }}

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: astral-sh/setup-uv@v6

      - name: Build the Python bindings for the cross-SDK scenarios
        env:
          BETTEROFFICE_E2E_VENV: ${{ runner.temp }}/e2e-venv
          CARGO_TARGET_DIR: ${{ github.workspace }}/bindings/target
        run: |
          pipx install maturin
          bun scripts/e2e/python-env.ts

      - name: Restore the pinned corpus documents
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/e2e-assets
          key: e2e-assets-${{ hashFiles('scripts/e2e/corpus.ts') }}

      - name: Run the scenarios
        env:
          QUALITY_ASSET_CACHE: ${{ runner.temp }}/e2e-assets
          BETTEROFFICE_E2E_VENV: ${{ runner.temp }}/e2e-venv
          BETTEROFFICE_E2E_OUTPUT: ${{ runner.temp }}/e2e-results
        run: bun run test:e2e

      - name: Upload the per-operation timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timings
          path: ${{ runner.temp }}/e2e-results
          if-no-files-found: error
          retention-days: 30
