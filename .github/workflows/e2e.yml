name: End-to-end

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Free GitHub-hosted runners first, then a fresh kyora VM per job; the router and the variables work as in ci.yml.
  route:
    name: Route runners
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.BO_CI_RUNNER || 'kyora-4x8' }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      browser: ${{ steps.route.outputs.browser }}
      corpus: ${{ steps.route.outputs.corpus }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        continue-on-error: true
        with:
          sparse-checkout: scripts/ci-route.mjs
          sparse-checkout-cone-mode: false

      - name: Route the jobs
        id: route
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE_GROUPS: browser:4 corpus
          ROUTE_PEER_SLOTS: ${{ github.event_name == 'workflow_dispatch' && '0' || '6' }}
          BO_CI_GH_LIMIT: ${{ vars.BO_CI_GH_LIMIT }}
          BO_CI_GH_RESERVE: ${{ vars.BO_CI_GH_RESERVE }}
          BO_CI_SPILL: ${{ vars.BO_CI_SPILL }}
          BO_CI_RUNNER: ${{ vars.BO_CI_RUNNER }}
        run: node scripts/ci-route.mjs

  corpus:
    name: Corpus scenarios
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.BO_CI_RUNNER || vars.BO_CI_SPILL != 'off' && needs.route.outputs.corpus || 'kyora-8x8' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure test paths
        run: |
          printf '%s\n' \
            "BETTEROFFICE_E2E_VENV=$RUNNER_TEMP/e2e-venv" \
            "QUALITY_ASSET_CACHE=$RUNNER_TEMP/e2e-assets" \
            "BETTEROFFICE_E2E_OUTPUT=$RUNNER_TEMP/e2e-results" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: e2e-corpus
          workspaces: |
            . -> target
            bindings -> target

      - uses: ./.github/actions/wasm-toolchain

      - name: Fingerprint the wasm inputs
        id: wasm
        run: echo "key=$(bun scripts/wasm-cache-key.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/wasm-pack
          key: wasm-pack-${{ steps.wasm.outputs.key }}

      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the harness contracts
        run: |
          bun run typecheck:e2e
          bun run test:e2e:harness

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.8'

      - name: Build the Python bindings
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/bindings/target
        run: |
          uv tool install maturin==1.14.1
          bun e2e/python-env.ts

      - name: Restore the pinned corpus documents
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/e2e-assets
          key: e2e-assets-${{ hashFiles('e2e/corpus.ts') }}

      - name: Run the corpus scenarios
        run: bun run test:e2e

      - name: Upload corpus results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-timings
          path: ${{ runner.temp }}/e2e-results
          if-no-files-found: warn
          retention-days: 14

  browser-build:
    name: Browser build
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.BO_CI_RUNNER || vars.BO_CI_SPILL != 'off' && needs.route.outputs.browser || 'kyora-8x8' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: e2e-browser
          workspaces: |
            . -> target
            bindings -> target

      - uses: ./.github/actions/wasm-toolchain

      - name: Fingerprint the wasm inputs
        id: wasm
        run: echo "key=$(bun scripts/wasm-cache-key.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target/wasm-pack
          key: wasm-pack-${{ steps.wasm.outputs.key }}

      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the packages and the desktop app
        run: bun run pretest:e2e:browser

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-browser-build
          path: |
            apps/desktop/dist
            packages/*/dist
            packages/*/src/wasm
            target/wasm-pack
          if-no-files-found: error
          retention-days: 3

  browser:
    name: ${{ matrix.name }}
    needs: [route, browser-build]
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.BO_CI_RUNNER || vars.BO_CI_SPILL != 'off' && needs.route.outputs.browser || 'kyora-8x8' }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            name: Browser editors (1/3)
          - shard: 2
            name: Browser editors (2/3)
          - shard: 3
            name: Browser editors (3/3)
    env:
      BETTEROFFICE_BROWSER_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure test paths
        run: |
          printf '%s\n' \
            "BETTEROFFICE_BROWSER_OUTPUT=$RUNNER_TEMP/browser-results" \
            "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: e2e-browser-build

      - name: Resolve the Playwright version
        id: playwright
        run: |
          version="$(bunx playwright --version | awk '{print $2}')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install headless Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run the production editors in Chromium
        run: bunx playwright test --config e2e/browser/playwright.config.ts --pass-with-no-tests

      - name: Run the editor plugin hosts in Chromium
        run: bunx playwright test --config e2e/browser/plugin-host/playwright.config.ts --pass-with-no-tests

      - name: Run the harness-gated docx editor in Chromium
        if: matrix.shard == 3
        env:
          DOCX_PEERLESS_HARNESS: '1'
          BETTEROFFICE_BROWSER_SHARD: ''
          BETTEROFFICE_BROWSER_OUTPUT: ${{ runner.temp }}/browser-results/harness
        run: |
          bun run --filter @betteroffice/desktop build
          bunx playwright test --config e2e/browser/playwright.config.ts --grep @harness

      - name: Upload browser report and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser-results
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish corpus timings
    needs: corpus
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'openooxml/betteroffice'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: e2e-timings
          path: ${{ runner.temp }}/e2e-results

      - name: Publish the corpus timings
        env:
          QUALITY_RENDER_BUCKET: betteroffice-fidelity
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun e2e/publish.ts "$RUNNER_TEMP/e2e-results"
