name: Rust toolchain
description: Installs the Rust version pinned in rust-toolchain.toml.

inputs:
  targets:
    description: Additional Rust targets to install.
    required: false
    default: ''
  components:
    description: Additional Rust components to install.
    required: false
    default: ''
  override:
    description: Use the pinned toolchain for the rest of the job, regardless of the checked-out source pin.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      env:
        RUST_TOOLCHAIN_FILE: ${{ github.action_path }}/../../../rust-toolchain.toml
        RUST_TOOLCHAIN_OVERRIDE: ${{ inputs.override }}
      run: |
        if ! toolchain=$(sed -n \
          "/^[[:blank:]]*\[toolchain\][[:blank:]]*\(#.*\)\{0,1\}[[:space:]]*$/,/^[[:blank:]]*\[/ s/^[[:blank:]]*channel[[:blank:]]*=[[:blank:]]*\(['\"]\)\([^'\"]*\)\1[[:space:]]*\(#.*\)\{0,1\}$/\2/p" \
          "$RUST_TOOLCHAIN_FILE") || [[ ! "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::rust-toolchain.toml must pin channel to an exact MAJOR.MINOR.PATCH version"
          exit 1
        fi
        echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
        if [[ "$RUST_TOOLCHAIN_OVERRIDE" == 'true' ]]; then
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
        fi

    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ steps.pin.outputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
