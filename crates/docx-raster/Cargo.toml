[package]
name = "betteroffice-docx-raster"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Server-side raster backend for DOCX display lists. Never part of the wasm build."
readme = "README.md"
keywords = ["docx", "word", "raster", "rendering", "png"]
categories = ["rendering", "graphics"]

[lib]
name = "docx_raster"

[dependencies]
base64 = "0.22"
docx-layout.workspace = true
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
ooxml-text.workspace = true
png = "0.18"
serde_json = "1"
tiny-skia = "0.12"
