[package]
name = "betteroffice-docx"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Typed native Rust facade for DOCX parsing, editing, layout, and serialization."
readme = "README.md"
keywords = ["docx", "word", "ooxml", "wordprocessingml"]
categories = ["parser-implementations", "rendering"]

[features]
default = ["raster", "fonts", "fonts-latin", "fonts-intl", "fonts-cjk"]
fonts = ["betteroffice-fonts/manager", "docx-layout/font-registration", "dep:ooxml-text"]
fonts-latin = ["fonts", "betteroffice-fonts/fonts-latin"]
fonts-intl = ["fonts", "betteroffice-fonts/fonts-intl"]
fonts-cjk = ["fonts", "betteroffice-fonts/fonts-cjk"]
raster = ["dep:docx-raster", "dep:ooxml-text", "docx-edit/base-latin", "docx-layout/base-latin"]
render-path-counter = ["raster"]

[dependencies]
betteroffice-fonts = { workspace = true }
docx-edit.workspace = true
docx-layout.workspace = true
docx-parse.workspace = true
docx-raster = { workspace = true, optional = true }
ooxml-opc.workspace = true
ooxml-text = { workspace = true, optional = true }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
ooxml-fidelity = { package = "betteroffice-ooxml-fidelity", path = "../ooxml-fidelity" }
png = "0.18"
