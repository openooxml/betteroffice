[package]
name = "vsdx-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The wasm-bindgen boundary for VSDX display-list compilation."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["raster"]
raster = ["vsdx-raster"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[dependencies]
vsdx-edit = { workspace = true, features = ["wasm"] }
vsdx-parse.workspace = true
vsdx-render.workspace = true
vsdx-raster = { workspace = true, optional = true }
vsdx-validate = { workspace = true }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
yrs = "0.27.3"
