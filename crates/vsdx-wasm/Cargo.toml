[package]
name = "vsdx-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The wasm-bindgen boundary for VSDX display-list compilation."

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[dependencies]
betteroffice-fonts = { workspace = true }
vsdx-edit = { workspace = true, features = ["wasm"] }
vsdx-parse.workspace = true
vsdx-render.workspace = true
vsdx-validate = { workspace = true }
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
yrs = "0.27.3"
