[package]
name = "betteroffice-vsdx-validate"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "Read-only diagram validation rules for VSDX diagrams."
readme = "README.md"
keywords = ["vsdx", "visio", "validation"]
categories = ["graphics", "parser-implementations"]

[lib]
name = "vsdx_validate"

[dependencies]
vsdx-parse.workspace = true
vsdx-resolve.workspace = true
vsdx-formula.workspace = true
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
