[package]
name = "betteroffice-docx-wasm-all"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Scratch facade: one wasm module re-exporting the docx opc+parse+layout+edit entrypoints."

[lib]
name = "docx_wasm_all"
crate-type = ["cdylib", "rlib"]

[dependencies]
ooxml-opc = { workspace = true, features = ["wasm"] }
docx-parse = { workspace = true, features = ["wasm", "tiff"] }
docx-layout.workspace = true
docx-edit = { workspace = true, features = ["wasm", "tiff"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
