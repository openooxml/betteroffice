[package]
name = "pptx-wasm"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "The wasm-bindgen boundary for PPTX display-list compilation."

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[features]
default = ["oneshot", "metafile-svg"]
metafile-svg = ["pptx-edit/metafile-svg", "pptx-engine/metafile-svg"]
oneshot = []

[dependencies]
betteroffice-fonts = { workspace = true }
pptx-edit = { workspace = true, features = ["wasm"] }
pptx-engine = { workspace = true, default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
