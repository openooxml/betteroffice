[package]
name = "metafile-svg-wasm"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[dependencies]
ooxml-metafile = { workspace = true, features = ["svg"] }
wasm-bindgen = "0.2"

[dev-dependencies]
pptx-edit = { workspace = true, features = ["metafile-svg"] }
