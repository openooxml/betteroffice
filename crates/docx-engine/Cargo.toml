[package]
name = "betteroffice-docx-engine"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Target-neutral DOCX engine boundary shared by the wasm and native backends."

[lib]
name = "docx_engine"

[dependencies]
docx-edit = { workspace = true, features = ["tiff", "metafile"] }
docx-layout.workspace = true
docx-parse.workspace = true
ooxml-opc.workspace = true

[dev-dependencies]
serde_json = "1"
