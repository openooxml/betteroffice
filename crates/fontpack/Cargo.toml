[package]
name = "fontpack"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "Internal font pack encoder and standalone zstd decoder."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fontpack"
required-features = ["build"]

[features]
default = []
wasm = ["dep:lol_alloc"]
build = ["dep:zstd", "dep:serde", "dep:serde_json", "dep:sha2", "dep:semver"]

[dependencies]
zstd = { version = "0.14.3", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
semver = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lol_alloc = { version = "=0.4.1", optional = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
zstd = { version = "0.14.3", default-features = false }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
