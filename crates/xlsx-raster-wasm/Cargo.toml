[package]
name = "xlsx-raster-wasm"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
xlsx-render.workspace = true
xlsx-raster.workspace = true

[dev-dependencies]
betteroffice-xlsx = { workspace = true, features = ["raster"] }
