[package]
name = "betteroffice-pptx-engine"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Target-neutral PPTX engine boundary shared by the wasm and native backends."

[lib]
name = "pptx_engine"

[dependencies]
ooxml-drawingml = { workspace = true, features = ["tiff"] }
pptx-edit = { workspace = true, features = ["engine"] }
pptx-parse.workspace = true
pptx-render.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yrs = "0.27.3"
