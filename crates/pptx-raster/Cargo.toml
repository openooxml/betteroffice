[package]
name = "betteroffice-pptx-raster"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Server-side raster backend for PPTX slide display lists. Never part of the wasm build."
readme = "README.md"
keywords = ["pptx", "powerpoint", "ooxml", "render", "raster"]
categories = ["rendering", "multimedia::images"]

[lib]
name = "pptx_raster"

[features]
fuzzing = []

[dependencies]
ooxml-raster = { workspace = true, features = ["svg"] }
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "tiff",
  "webp",
] }
ooxml-drawingml.workspace = true
ooxml-metafile = { workspace = true, features = ["svg"] }
ooxml-text.workspace = true
pptx-edit = { workspace = true, features = ["metafile-svg"] }
pptx-render.workspace = true
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
tiny-skia = "0.12"

[dev-dependencies]
png = "0.18"
serde_json = "1"
