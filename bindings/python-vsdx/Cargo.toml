[package]
name = "betteroffice-vsdx-python"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
homepage = "https://betteroffice.dev"
repository = "https://github.com/openooxml/betteroffice"
description = "Python bindings for the BetterOffice VSDX engine."
publish = false

[lib]
name = "_betteroffice_vsdx"
crate-type = ["cdylib"]

[dependencies]
betteroffice-vsdx = { path = "../../crates/betteroffice-vsdx" }
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
python-common = { package = "betteroffice-python-common", path = "../python-common" }
vsdx-parse = { path = "../../crates/vsdx-parse", package = "betteroffice-vsdx-parse" }
