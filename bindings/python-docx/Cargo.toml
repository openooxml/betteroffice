[package]
name = "betteroffice-docx-python"
version = "0.0.2"
edition = "2024"
license = "Apache-2.0"
homepage = "https://betteroffice.dev"
repository = "https://github.com/openooxml/betteroffice"
description = "Python bindings for the BetterOffice DOCX engine."
publish = false

[lib]
name = "_betteroffice_docx"
crate-type = ["cdylib"]

[dependencies]
betteroffice-docx = { path = "../../crates/betteroffice-docx", features = ["raster"] }
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
python-common = { package = "betteroffice-python-common", path = "../python-common" }
serde_json = "1"
