[package]
name = "betteroffice-pptx-node"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
homepage = "https://betteroffice.dev"
repository = "https://github.com/openooxml/betteroffice"
description = "Node.js bindings for the BetterOffice PPTX engine."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
betteroffice-pptx = { path = "../../crates/betteroffice-pptx", features = ["raster"] }
napi = { version = "3.12.4", features = ["napi8", "serde-json"] }
napi-derive = "3.6.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2.4.2"
