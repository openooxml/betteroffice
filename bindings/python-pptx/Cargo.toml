[package]
name = "betteroffice-pptx-python"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
homepage = "https://betteroffice.dev"
repository = "https://github.com/openooxml/betteroffice"
description = "Python bindings for the BetterOffice PPTX engine."
publish = false

[lib]
name = "_betteroffice_pptx"
crate-type = ["cdylib"]

[dependencies]
betteroffice-pptx = { path = "../../crates/betteroffice-pptx" }
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
python-common = { package = "betteroffice-python-common", path = "../python-common" }
serde_json = "1"
