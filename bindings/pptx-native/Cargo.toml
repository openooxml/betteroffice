[package]
name = "betteroffice-pptx-native"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://betteroffice.dev"
repository = "https://github.com/openooxml/betteroffice"
description = "Node.js bindings for the BetterOffice PPTX engine."
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
test-hooks = []

[dependencies]
ooxml-font-preflight = { package = "betteroffice-ooxml-font-preflight", path = "../../crates/ooxml-font-preflight", default-features = false, features = ["pptx"] }
mimalloc = { version = "0.1.52", optional = true, default-features = false, features = ["v2", "local_dynamic_tls"] }
betteroffice-fonts = { path = "../../crates/betteroffice-fonts" }
betteroffice-pptx-engine = { path = "../../crates/pptx-engine", features = ["raster", "fonts"] }
getrandom = "0.3"
napi = { version = "3.12.4", features = ["napi8", "serde-json"] }
napi-derive = "3.6.5"
pptx-edit = { package = "betteroffice-pptx-edit", path = "../../crates/pptx-edit", features = ["metafile-svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2.4.2"
