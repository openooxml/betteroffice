[package]
name = "betteroffice-pptx-native"
version = "0.5.1"
edition = "2024"
license = "Apache-2.0"
homepage = "https://betteroffice.dev"
repository = "https://github.com/openooxml/betteroffice"
description = "Node.js bindings for the BetterOffice PPTX engine."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
betteroffice-fonts = { path = "../../crates/betteroffice-fonts" }
betteroffice-pptx-engine = { path = "../../crates/pptx-engine" }
getrandom = "0.3"
napi = { version = "3.12.4", features = ["napi8", "serde-json"] }
napi-derive = "3.6.5"

[build-dependencies]
napi-build = "2.4.2"
